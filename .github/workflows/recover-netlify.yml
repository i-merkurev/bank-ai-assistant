name: Recover published Netlify build

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/recover.py'
      - '.github/workflows/recover-netlify.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public deployment
        run: python3 scripts/recover.py
      - name: Check downloaded files
        run: |
          test -f deployed/index.html
          ls -lah deployed
      - name: Commit recovered build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployed/
          if ! git diff --cached --quiet; then
            git commit -m "Recover public Netlify deployment files"
            git push
          fi
