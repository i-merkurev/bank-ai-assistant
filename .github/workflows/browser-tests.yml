name: Browser interaction and visual parity tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/browser-tests.yml'

permissions:
  contents: write

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: npm install --save-dev @playwright/test pixelmatch pngjs --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run interaction and visual parity tests
        run: npx playwright test
      - name: Save complete dependency lockfile
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add repeatable Playwright test dependencies'
            git push
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
