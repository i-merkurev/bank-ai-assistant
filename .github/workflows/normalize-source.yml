name: Normalize reconstructed React source

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/normalize-source.mjs'
      - '.github/workflows/normalize-source.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Normalize component and state names
        run: node scripts/normalize-source.mjs
      - name: Format JSX modules
        run: npx prettier --write "src/**/*.{jsx,js,css}"
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'Improve readability of restored React components'
            git push
          fi
